<!doctype html><html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>今日のりんごハンコ</title><link rel="stylesheet" href="style.css">
</head><body><main class="shell">
<h1>🍎 今日のりんごハンコ</h1>
<p class="muted">初回だけお名前を登録します。次回からは出席ボタンを押すだけです。</p>
<section class="panel">
  <div id="nameSetup">
    <div class="grid">
      <label>名前を検索<input id="search" placeholder="名前・よみがな"></label>
      <label>登録済みの名前<select id="listenerSelect"><option value="">選んでください</option></select></label>
    </div>
    <button id="rememberBtn" class="primary" style="width:100%;margin-top:10px">この端末に名前を記憶する</button>
  </div>
  <div id="rememberedName" class="message hidden"></div>
  <button id="changeNameBtn" class="soft hidden" style="margin-top:8px">名前を変更する</button>
  <div class="cardHead"><strong id="cardName">お名前を選んでください</strong><span id="cardDate"></span></div>
  <div id="card" class="stampCard">
    <img id="cardImg" class="cardImg" src="assets/card-early.png" alt="スタンプカード">
    <div id="stampLayer" class="stampLayer"></div>
  </div>
  <button id="stampBtn" class="red" style="width:100%;font-size:20px" disabled>🍎 出席ハンコを押す</button>
  <div id="message" class="message">お名前を選択してください。</div>
  <p class="muted" id="rolloverNote"></p>
</section>
<script type="module">
import {
 db, auth, collection, doc, getDoc, getDocs, setDoc, addDoc, query, where, orderBy,
 serverTimestamp, signInAnonymously, todayJst, calendarTodayJst, monthOf, dayOf,
 periodOf, periodLabel, stampFor, escapeHtml, DAY_ROLLOVER_HOUR,
 STAMP_IMAGE, CARD_IMAGE, CARD_CELLS
} from "./common.js";

const $ = s => document.querySelector(s);
const select=$("#listenerSelect"), search=$("#search"), message=$("#message");
const layer=$("#stampLayer"), stampBtn=$("#stampBtn"), cardImg=$("#cardImg");
const SAVED_LISTENER_KEY = "appleStampSavedListenerId";

let listeners=[], selected=null, ctx=null, busy=false;

/* 日付は「押した瞬間」に計算する。ページを開きっぱなしでも日付がずれない。 */
function currentCtx(){
 const today = todayJst();
 const day = dayOf(today);
 return { today, month: monthOf(today), day, period: periodOf(day) };
}
function refreshCtx(){
 ctx = currentCtx();
 $("#cardDate").textContent = `${ctx.month.replace("-","年")}月 ${periodLabel(ctx.period)}`;
 const src = CARD_IMAGE[ctx.period];
 if(!cardImg.src.endsWith(src)) cardImg.src = src;
 $("#rolloverNote").textContent =
   ctx.today === calendarTodayJst()
     ? `記録される日付：${ctx.today}`
     : `記録される日付：${ctx.today}（${DAY_ROLLOVER_HOUR}時を過ぎたので翌日分になります）`;
 return ctx;
}
refreshCtx();

try{
 await signInAnonymously(auth);
 await loadListeners();
}catch(err){
 console.error(err);
 message.textContent = "読み込みに失敗しました。通信環境を確認して、ページを再読み込みしてください。";
}

/* activeでの絞り込みはJS側で行う（複合インデックス不要にするため） */
async function loadListeners(){
 const snap = await getDocs(query(collection(db,"listeners"), orderBy("kana")));
 listeners = snap.docs.map(d=>({id:d.id,...d.data()})).filter(v=>v.active!==false);
 renderOptions("");
 const saved = listeners.find(v => v.id === localStorage.getItem(SAVED_LISTENER_KEY));
 if(saved){ selected = saved; showRememberedMode(); await renderCard(); }
}
function renderOptions(word){
 const w = word.trim().toLowerCase();
 const filtered = listeners.filter(v => (v.name+" "+(v.kana||"")).toLowerCase().includes(w));
 select.innerHTML = '<option value="">選んでください</option>' +
   filtered.map(v=>`<option value="${v.id}">${escapeHtml(v.name)}</option>`).join("");
}
search.addEventListener("input", ()=>renderOptions(search.value));
select.addEventListener("change", async()=>{
 selected = listeners.find(v=>v.id===select.value) || null;
 $("#cardName").textContent = selected ? `${selected.name}さんのカード` : "お名前を選んでください";
 await renderCard();
});

$("#rememberBtn").addEventListener("click", async()=>{
 selected = listeners.find(v=>v.id===select.value) || null;
 if(!selected){ message.textContent="記憶するお名前を選んでください。"; return }
 localStorage.setItem(SAVED_LISTENER_KEY, selected.id);
 showRememberedMode();
 await renderCard();
});

$("#changeNameBtn").addEventListener("click", ()=>{
 localStorage.removeItem(SAVED_LISTENER_KEY);
 selected = null;
 search.value = "";
 renderOptions("");
 select.value = "";
 $("#nameSetup").classList.remove("hidden");
 $("#rememberedName").classList.add("hidden");
 $("#changeNameBtn").classList.add("hidden");
 $("#cardName").textContent = "お名前を選んでください";
 layer.innerHTML = "";
 message.textContent = "新しいお名前を選び、この端末に記憶してください。";
 stampBtn.disabled = true;
});

function showRememberedMode(){
 $("#nameSetup").classList.add("hidden");
 $("#rememberedName").classList.remove("hidden");
 $("#changeNameBtn").classList.remove("hidden");
 $("#rememberedName").textContent = `この端末の登録名：${selected.name}さん`;
 $("#cardName").textContent = `${selected.name}さんのカード`;
}

async function renderCard(){
 layer.innerHTML = "";
 if(!selected){ message.textContent="お名前を選択してください。"; stampBtn.disabled=true; return }
 refreshCtx();
 try{
   const snap = await getDocs(query(collection(db,"attendance"),
     where("listenerId","==",selected.id), where("month","==",ctx.month), where("period","==",ctx.period)));
   const cells = CARD_CELLS[ctx.period] || {};
   snap.docs.map(d=>d.data()).sort((a,b)=>a.day-b.day).forEach(a=>{
     const cell = cells[a.day];
     if(!cell) return;                       // 台紙にマスが無い日は描かない
     const [x,y,,h] = cell;
     const el = document.createElement("img");
     el.className = "stamp";
     el.src = STAMP_IMAGE;
     el.alt = `${a.day}日 出席`;
     el.style.left = x+"%"; el.style.top = y+"%"; el.style.height = (h*0.94)+"%";
     if(a.date === ctx.today) el.classList.add("justStamped");
     layer.appendChild(el);
   });
   const exists = await getDoc(doc(db,"attendance",`${ctx.today}_${selected.id}`));
   message.textContent = exists.exists() ? "今日はすでにハンコ済みです。" : "まだ今日のハンコを押していません。";
   stampBtn.disabled = exists.exists() || busy;
 }catch(err){
   console.error(err);
   message.textContent = "カードの読み込みに失敗しました。ページを再読み込みしてください。";
   stampBtn.disabled = true;
 }
}

stampBtn.addEventListener("click", async()=>{
 if(busy) return;
 if(!selected){ message.textContent="先にお名前を選んでください。"; return }
 busy = true;
 stampBtn.disabled = true;              // 連打による二重登録を防ぐ
 try{
   refreshCtx();
   const { today, month, day, period } = ctx;
   const ref = doc(db,"attendance",`${today}_${selected.id}`);
   if((await getDoc(ref)).exists()){ message.textContent="今日はすでにハンコ済みです。"; return }
   const snap = await getDocs(query(collection(db,"attendance"),
     where("listenerId","==",selected.id), where("month","==",month), where("period","==",period)));
   const count = snap.size + 1, stamp = stampFor();
   await setDoc(ref,{
     listenerId:selected.id, listenerName:selected.name, date:today, month, day, period,
     stampNo:count, stampType:stamp, createdAt:serverTimestamp()
   });
   await addDoc(collection(db,"events"),{
     type:"attendance", listenerId:selected.id, listenerName:selected.name, date:today,
     month, day, period, stampType:stamp, createdAt:serverTimestamp()
   });
   message.textContent = `${stamp} ハンコを押しました！ 今日もありがとう！`;
 }catch(err){
   console.error(err);
   message.textContent = "保存できませんでした。通信環境を確認して、もう一度押してください。";
 }finally{
   busy = false;
   await renderCard();
 }
});

/* 開きっぱなしでも日付の切り替わりに追従する */
setInterval(async()=>{
 if(busy) return;
 if(currentCtx().today !== ctx.today) await renderCard();
}, 30000);
</script></main></body></html>
