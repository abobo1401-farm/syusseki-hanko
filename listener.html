<!doctype html><html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>今日のりんごハンコ</title><link rel="stylesheet" href="style.css">
</head><body><main class="shell">
<h1>🍎 今日のりんごハンコ</h1>

<section class="panel">
  <!-- 初回だけ表示 -->
  <div id="nameSetup">
    <p class="muted">初回だけお名前を登録します。次回からは、この端末では出席ボタンを押すだけです。</p>
    <div class="grid">
      <label>お名前<input id="regName" maxlength="20" placeholder="配信で呼ばれている名前"></label>
      <label>よみがな（任意）<input id="regKana" maxlength="30" placeholder="ひらがなで"></label>
    </div>
    <button id="regBtn" class="primary" style="width:100%;margin-top:10px;font-size:18px">この名前で始める</button>
    <div id="regMsg" class="muted" style="margin-top:8px"></div>
  </div>

  <!-- 登録後に表示 -->
  <div id="stampArea" class="hidden">
    <div id="rememberedName" class="message"></div>
    <div class="cardHead"><strong id="cardName">お名前を登録してください</strong><span id="cardDate"></span></div>
    <div id="card" class="stampCard">
      <img id="cardImg" class="cardImg" src="assets/card-early.png" alt="スタンプカード">
      <div id="stampLayer" class="stampLayer"></div>
    </div>
    <button id="stampBtn" class="red" style="width:100%;font-size:22px;padding:18px" disabled>🍎 出席ハンコを押す</button>
    <div id="message" class="message">読み込み中…</div>
    <button id="changeNameBtn" class="soft" style="margin-top:10px">名前を変更する</button>
  </div>

  <p class="muted" id="rolloverNote" style="margin-top:12px"></p>
</section>

<script type="module">
import {
 db, auth, collection, doc, getDoc, getDocs, setDoc, addDoc, query, where, orderBy,
 serverTimestamp, signInAnonymously, todayJst, calendarTodayJst, monthOf, dayOf,
 periodOf, periodLabel, stampFor, escapeHtml, DAY_ROLLOVER_HOUR,
 STAMP_IMAGE, CARD_IMAGE, CARD_CELLS, playStampSound, audioCtx
} from "./common.js";

const $ = s => document.querySelector(s);
const message=$("#message"), layer=$("#stampLayer"), stampBtn=$("#stampBtn"), cardImg=$("#cardImg"), card=$("#card");
const SAVED_LISTENER_KEY = "appleStampSavedListenerId";

let listeners=[], allListeners=[], selected=null, ctx=null, busy=false;

/* 重複判定用：空白を取り除いて小文字化 */
const normalize = s => String(s ?? "").replace(/[\s\u3000]/g,"").toLowerCase();

/* assets が読み込めなかった場合の代替絵柄 */
const FALLBACK_STAMP = "data:image/svg+xml;utf8," + encodeURIComponent(
 '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">' +
 '<rect x="46" y="8" width="6" height="20" rx="3" fill="#755033"/>' +
 '<circle cx="50" cy="58" r="38" fill="#d94c4c"/>' +
 '<ellipse cx="36" cy="45" rx="9" ry="13" fill="#fff" opacity=".35"/></svg>');

/* 日付は「押した瞬間」に計算する。ページを開きっぱなしでも日付がずれない。 */
function currentCtx(){
 const today = todayJst(), day = dayOf(today);
 return { today, month: monthOf(today), day, period: periodOf(day) };
}
function refreshCtx(){
 ctx = currentCtx();
 document.body.dataset.period = ctx.period;   // 旬に合わせて画面の色を切り替える
 $("#cardDate").textContent = `${ctx.month.replace("-","年")}月 ${periodLabel(ctx.period)}`;
 const src = CARD_IMAGE[ctx.period];
 if(!cardImg.src.endsWith(src)) cardImg.src = src;
 $("#rolloverNote").textContent =
   ctx.today === calendarTodayJst()
     ? `記録される日付：${ctx.today}`
     : `記録される日付：${ctx.today}（${DAY_ROLLOVER_HOUR}時を過ぎたので翌日分になります）`;
 return ctx;
}
refreshCtx();

async function loadListeners(){
 const snap = await getDocs(query(collection(db,"listeners"), orderBy("kana")));
 allListeners = snap.docs.map(d=>({id:d.id,...d.data()}));
 listeners = allListeners.filter(v=>v.active!==false);
}

/* 端末に記憶された名前があれば、そのままハンコ画面へ */
function showStampMode(){
 $("#nameSetup").classList.add("hidden");
 $("#stampArea").classList.remove("hidden");
 $("#rememberedName").textContent = `この端末の登録名：${selected.name}さん`;
 $("#cardName").textContent = `${selected.name}さんのカード`;
}
function showSetupMode(){
 $("#nameSetup").classList.remove("hidden");
 $("#stampArea").classList.add("hidden");
 $("#regName").value=""; $("#regKana").value=""; $("#regMsg").textContent="";
 selected = null;
}

/* 名前を決めてハンコ画面へ進む */
async function useListener(v, note){
 selected = v;
 localStorage.setItem(SAVED_LISTENER_KEY, v.id);
 showStampMode();
 await renderCard();
 if(note) message.textContent = note;
 stampBtn.scrollIntoView({behavior:"smooth", block:"center"});
}

$("#regBtn").addEventListener("click", async()=>{
 const btn = $("#regBtn"), msg = $("#regMsg");
 const name = $("#regName").value.trim();
 const kana = $("#regKana").value.trim() || name;   // 未入力なら名前を並び順に使う
 if(!name){ msg.textContent = "お名前を入力してください。"; return }
 if(name.length > 20){ msg.textContent = "お名前は20文字までです。"; return }

 // 同じ名前がすでにあれば、それを使う（二重登録しない）
 const hit = allListeners.find(v => normalize(v.name) === normalize(name));
 if(hit){
   if(hit.active === false){
     msg.textContent = "このお名前は現在停止中です。配信のコメントで声をかけてください。";
     return;
   }
   await useListener(hit, `おかえりなさい、${hit.name}さん！`);
   return;
 }

 btn.disabled = true; msg.textContent = "登録中…";
 try{
   const ref = await addDoc(collection(db,"listeners"), {
     name, kana, active:true, selfRegistered:true, createdAt:serverTimestamp()
   });
   await loadListeners();
   const v = listeners.find(x => x.id === ref.id) || { id:ref.id, name, kana };
   await useListener(v, `${name}さん、登録できました。ハンコを押してください。`);
 }catch(err){
   console.error(err);
   msg.textContent = "登録できませんでした。通信環境を確認して、もう一度お試しください。";
 }finally{
   btn.disabled = false;
 }
});

$("#changeNameBtn").addEventListener("click", ()=>{
 if(!confirm("この端末の登録名を消して、別の名前を登録しますか？\n出席の記録は消えません。")) return;
 localStorage.removeItem(SAVED_LISTENER_KEY);
 layer.innerHTML = "";
 showSetupMode();
});

async function renderCard(keepMessage=false, animateDay=null){
 layer.innerHTML = "";
 if(!selected){ stampBtn.disabled=true; return }
 refreshCtx();
 try{
   const snap = await getDocs(query(collection(db,"attendance"),
     where("listenerId","==",selected.id), where("month","==",ctx.month), where("period","==",ctx.period)));
   const cells = CARD_CELLS[ctx.period] || {};
   snap.docs.map(d=>d.data()).sort((a,b)=>a.day-b.day).forEach(a=>{
     const cell = cells[a.day];
     if(!cell) return;
     const [x,y,,h] = cell;
     const el = document.createElement("img");
     el.className = "stamp";
     el.src = STAMP_IMAGE;
     el.alt = `${a.day}日 出席`;
     el.onerror = ()=>{ el.onerror=null; el.src=FALLBACK_STAMP; };
     el.style.left = x+"%"; el.style.top = y+"%"; el.style.height = (h*0.94)+"%";
     if(a.day === animateDay){
       el.classList.add("dropIn");
       const ring = document.createElement("div");
       ring.className = "impactRing";
       ring.style.left = x+"%"; ring.style.top = y+"%";
       layer.appendChild(ring);
       card.classList.remove("hit"); void card.offsetWidth; card.classList.add("hit");
     }
     layer.appendChild(el);
   });
   const done = (await getDoc(doc(db,"attendance",`${ctx.today}_${selected.id}`))).exists();
   if(!keepMessage) message.textContent = done
     ? "今日はもうハンコを押しています。また明日！"
     : "まだ今日のハンコを押していません。";
   stampBtn.disabled = done || busy;
 }catch(err){
   console.error(err);
   message.textContent = "カードの読み込みに失敗しました。ページを再読み込みしてください。";
   stampBtn.disabled = true;
 }
}

stampBtn.addEventListener("click", async()=>{
 if(busy || !selected) return;
 busy = true;
 stampBtn.disabled = true;              // 連打による二重登録を防ぐ
 try{ audioCtx() }catch(err){}          // タップの瞬間に音声を起こす（初回無音の対策）
 let stamped = false, stampedDay = null;
 try{
   refreshCtx();
   const { today, month, day, period } = ctx;
   const ref = doc(db,"attendance",`${today}_${selected.id}`);
   if((await getDoc(ref)).exists()){ message.textContent="今日はもうハンコを押しています。また明日！"; return }
   const snap = await getDocs(query(collection(db,"attendance"),
     where("listenerId","==",selected.id), where("month","==",month), where("period","==",period)));
   const count = snap.size + 1, stamp = stampFor();
   await setDoc(ref,{
     listenerId:selected.id, listenerName:selected.name, date:today, month, day, period,
     stampNo:count, stampType:stamp, createdAt:serverTimestamp()
   });
   await addDoc(collection(db,"events"),{
     type:"attendance", listenerId:selected.id, listenerName:selected.name, date:today,
     month, day, period, stampType:stamp, createdAt:serverTimestamp()
   });
   stamped = true; stampedDay = day;
   setTimeout(()=>playStampSound(0.5), 330);   // 着地の瞬間に合わせる
   message.textContent = `🍎 ${day}日のハンコを押しました！ 今日もありがとう！`;
 }catch(err){
   console.error(err);
   message.textContent = "保存できませんでした。通信環境を確認して、もう一度押してください。";
 }finally{
   busy = false;
   await renderCard(stamped, stamped ? stampedDay : null);
 }
});

/* 開きっぱなしでも日付の切り替わりに追従する */
setInterval(async()=>{
 if(busy || !selected) return;
 if(currentCtx().today !== ctx.today) await renderCard();
}, 30000);

/* 起動（イベント登録がすべて済んでから実行する） */
async function start(){
 try{
   await signInAnonymously(auth);
   await loadListeners();
   const saved = listeners.find(v => v.id === localStorage.getItem(SAVED_LISTENER_KEY));
   if(saved){
     selected = saved;
     showStampMode();
     await renderCard();
   }else{
     showSetupMode();
   }
 }catch(err){
   console.error(err);
   $("#regMsg").textContent = "読み込みに失敗しました。通信環境を確認して、ページを再読み込みしてください。";
 }
}
start();
</script></main></body></html>
